    function loadPlayer() {

      const root    = document.getElementById('profile-root');

        root.innerHTML = `
          <div class="page-hero"><h1>Player Not Found</h1></div>
          <div class="section" style="text-align:center; padding:3rem 2rem;">
            <p style="color:var(--text-light); margin-bottom:1.5rem;">We couldn't find that player profile.</p>
            <a href="players.html" class="btn btn-gold">← Back to Players</a>
          </div>`;
        return;
      }

      document.title = p.name + ' – The Galunga Tour';
      const color    = teamColors[p.team] || 'var(--black)';
      const autoQBadge = p.autoQ
        ? `<span class="badge badge-major" style="margin-left:0.75rem; vertical-align:middle;">Auto-Qualifier</span>`
        : '';

      const initials = p.name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();

      const highlightItems = p.highlights.length
        ? p.highlights.map(h => `<li>${h}</li>`).join('')
        : '<li style="color:var(--text-light); font-style:italic;">Career highlights coming soon.</li>';

      root.innerHTML = `
        <div class="section" style="padding-top:2.5rem;">

          <a href="players.html" style="display:inline-flex; align-items:center; gap:0.4rem; color:var(--text-light); font-size:0.85rem; text-decoration:none; margin-bottom:1.5rem;">

              <div class="profile-meta">

                <span class="profile-meta-item" style="color:var(--iron-gray);">|</span>
                <span class="profile-meta-item"><strong>Rank:</strong> #${p.rank}</span>
                ${p.hi != null ? `<span class="profile-meta-item" style="color:var(--iron-gray);">|</span><span class="profile-meta-item"><strong>HDCP:</strong> ${formatHI(p.hi)}</span>` : ''}
              </div>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-top:0;">
            <div>
              <h2 class="section-title">About</h2>
              <br>
              ${p.bio.split('\n\n').map(para => `<p style="line-height:1.8; color:var(--text-light); margin-bottom:1rem;">${para}</p>`).join('')}
            </div>
            <div>
              <h2 class="section-title">Career Highlights</h2>
              <br>
              <ul class="highlight-list">${highlightItems}</ul>
            </div>
          </div>

          <div style="margin-top:2.5rem; padding-top:2rem; border-top:1px solid #e5e5e5; display:flex; gap:1rem; flex-wrap:wrap;">
            <a href="players.html" class="btn btn-gold">← All Players</a>
            <a href="schedule.html" class="btn" style="background:transparent; color:var(--red); border:2px solid var(--red);">2026 Schedule</a>
          </div>

        </div>`;

    }

    function formatHI(hi) {
      const n = parseFloat(hi);
      if (isNaN(n)) return String(hi);
      return n < 0 ? `+${Math.abs(n).toFixed(1)}` : n.toFixed(1);
    }

    window.onload = loadPlayer;
  </script>

</body>
</html>

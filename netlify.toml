# Netlify configuration for The Galunga Tour

[build]
  publish = "."          # static files are at the repo root
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"    # required for built-in fetch in serverless functions

# Friendly 404 fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

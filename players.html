    const teamColors = {
      'Team Courtney': 'var(--navy)',
      'Team Buchanan': 'var(--red)',
      'Bandon Dunes':  'var(--fairway)',
      'Draft Pool':    'var(--iron-gray)',
      '—':             'var(--black)',
    };

    const grid = document.getElementById('player-grid');

    players.forEach(p => {
      const color = teamColors[p.team] || 'var(--black)';
      const autoQBadge = p.autoQ
        ? `<span class="badge badge-major" style="font-size:0.62rem; padding:0.12rem 0.45rem;">Auto-Q</span>`
        : '';

      grid.innerHTML += `
        <a href="player.html?id=${p.id}" class="player-card">
          <div class="player-card-top" style="background:${color};">
            <span class="player-card-rank">#${p.rank}</span>
            ${autoQBadge}
          </div>
          <div class="player-card-body">
            <div class="player-card-name">${p.name}${p.hi != null ? `<span class="player-card-hcp">${formatHI(p.hi)}</span>` : ''}</div>
            <div class="player-card-team">${p.team}</div>
            <div class="player-card-footer">
              <span>${p.points.toFixed(2)} pts</span>
              <span style="color:var(--red); font-size:0.8rem;">View Profile →</span>
            </div>
          </div>
        </a>`;
    });

    function formatHI(hi) {
      const n = parseFloat(hi);
      if (isNaN(n)) return String(hi);
      return n < 0 ? `+${Math.abs(n).toFixed(1)}` : n.toFixed(1);
    }
